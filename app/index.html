<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nutella Tsunami Manager</title>
  <meta name="description" content="Prepare, validate and write SD cards for the Robertsonics Tsunami and Tesseract Nutella Tsunami.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111a1e'/%3E%3Crect x='6' y='6' width='9' height='9' rx='2' fill='%234fd6c3'/%3E%3Crect x='17' y='6' width='9' height='9' rx='2' fill='%232a8f86'/%3E%3Crect x='6' y='17' width='9' height='9' rx='2' fill='%23a3d17f'/%3E%3Crect x='17' y='17' width='9' height='9' rx='2' fill='%230e6b60'/%3E%3C/svg%3E">
  <script>
    try {
      const t = localStorage.getItem('ntm-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'parchment' : 'night');
      document.documentElement.dataset.theme = t;
    } catch { document.documentElement.dataset.theme = 'night'; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="banner" class="banner" hidden></div>
  <header id="header" class="header"></header>
  <div class="body">
    <div id="nav" class="nav"></div>
    <main id="main" class="main"></main>
    <aside id="inspector" class="inspector" aria-label="Track inspector"></aside>
  </div>
  <footer class="status">
    <div id="job" class="job" hidden></div>
  </footer>
  <div id="global"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
